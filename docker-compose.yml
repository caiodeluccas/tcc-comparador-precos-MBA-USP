# A linha version é opcional nas versões novas do Docker, mas mantive a 3.9
version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      WRITER_PASSWORD: ${WRITER_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Aqui ele vai ler seus SQLs 01 a 08 e o 99_set_passwords.sh
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - price_comp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  data_collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: coletor_dados_app
    restart: "no"
    environment:
      DATABASE_URL: postgresql://pc_data_writer:${WRITER_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: pc_data_writer
      DB_PASS: ${WRITER_PASSWORD}
      CANOPY_API_KEY: ${CANOPY_API_KEY} # Adicione esta linha exatamente assim
    depends_on:
      db:
        condition: service_healthy
    networks:
      - price_comp_network

