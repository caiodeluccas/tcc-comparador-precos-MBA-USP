version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      WRITER_PASSWORD: ${WRITER_PASSWORD}
      READER_PASSWORD: ${READER_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - price_comp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  data_collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: coletor_dados_app
    restart: "no"
    environment:
      DATABASE_URL: postgresql://pc_data_writer:${WRITER_PASSWORD}@db:5432/${DB_NAME}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: pc_data_writer
      DB_PASS: ${WRITER_PASSWORD}
      CANOPY_API_KEY: ${CANOPY_API_KEY}
    # --- AJUSTE DOS LOGS ---
    volumes:
      - ./meus_logs_tcc:/app/logs
    # -----------------------
    depends_on:
      db:
        condition: service_healthy
    networks:
      - price_comp_network

  api_processor:
    build:
      context: .
      dockerfile: ./processor/Dockerfile
    container_name: processador_dados_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pc_app_admin:LKNnuqhQ2Umv*W!7oYLJM4a0%40%23qqbm41@db:5432/price_comp
      - PYTHONPATH=/app
      - DB_HOST=db
      - DB_NAME=price_comp
      - DB_USER=pc_app_admin
      - DB_PASS=LKNnuqhQ2Umv*W!7oYLJM4a0@#qqbm41
    # --- AJUSTE DOS LOGS ---
    volumes:
      - ./meus_logs_tcc:/app/logs
    # -----------------------
    depends_on:
      db:
        condition: service_healthy
    networks:
      - price_comp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_tcc_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://api_processor:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api_processor
    networks:
      - price_comp_network  

volumes:
  postgres_data:

networks:
  price_comp_network:
    driver: bridge